[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "farq"
version = "0.2.0"
description = "A Python library for raster change detection and water-body analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Feras Alqrinawi", email = "ferasqr@yahoo.com" }]
keywords = ["raster", "remote-sensing", "change-detection", "gis", "ndwi", "water", "satellite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "rasterio>=1.3",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "joblib>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "psutil>=5"]
dev = ["farq[test]", "ruff>=0.6", "mypy>=1.8", "build>=1.0", "twine>=5"]

[project.urls]
Homepage = "https://github.com/ferasqr/farq"
Repository = "https://github.com/ferasqr/farq"
Issues = "https://github.com/ferasqr/farq/issues"

[tool.setuptools.packages.find]
include = ["farq*"]

[tool.setuptools.package-data]
farq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["performance: slow performance/memory tests (deselect with -m 'not performance')"]
filterwarnings = ["error::DeprecationWarning:farq.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"farq/__init__.py" = ["F401"]
"farq/utils.py" = ["A001"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
